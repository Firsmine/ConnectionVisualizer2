<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="topBar">
            <button id="btnSave" class="btnBar">
                <img src="assets/download.svg" alt="download" class="icon">Save Image
            </button>
            <button id="btnSave" class="btnBar">
                <img src="assets/find_path.svg" alt="find path" class="icon">Find Path
            </button>
            <button id="btnSave" class="btnBar">
                <img src="assets/connect.svg" alt="connect" class="icon">Connect
            </button>
            <button id="btnSave" class="btnBar">
                <img src="assets/delete.svg" alt="delete" class="icon">Delete
            </button>
            <button id="btnSave" class="btnBar">
                <img src="assets/empty.svg" alt="clear" class="icon">Clear
            </button>
        </div>
        <div id="statusLabel" class="status-hidden">Choose target node</div>

        <svg id="canvas" width="100%" height="100%">
        <defs>
          <pattern
            id="grid"
            width="10"
            height="10"
            patternUnits="userSpaceOnUse"
          >
            <path
              d="M 10 0 L 0 0 0 10"
              fill="none"
              stroke="#bbb"
              stroke-width="1"
            />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <g id="workspace">
          <g id="layerEdges"></g>
          <g id="layerNodes"></g>
        </g>
      </svg>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
